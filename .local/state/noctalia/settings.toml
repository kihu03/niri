config_version = 16

[bar.default]
background_opacity = 0.0
capsule = true
capsule_border = "#918f9c"
capsule_border_width = 1
capsule_fill = "surface_container"
capsule_padding = 7
capsule_radius = 10
capsule_thickness = 0.71999999999999997
center = [ "notifications", "clock", "clipboard" ]
end = [ "tray", "network", "synthetic", "battery", "control-center", "session" ]
font_scale = 0.89999998733401299
margin_ends = 80
scale = 1.2500000111758709
start = [ "launcher", "workspaces", "audio-vis" ]
thickness = 40
widget_spacing = 8

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 718.4000244140625
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "kihu/synthetic-usage" ]

[theme]
builtin = "Ayu"
community_palette = "Oxocarbon"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper.default]
path = "/home/kinh/Pictures/Lotus flower Purple aesthetic 4K Wallpaper.jpg"

[wallpaper.last]
path = "/home/kinh/Pictures/Lotus flower Purple aesthetic 4K Wallpaper.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/kinh/Pictures/Lotus flower Purple aesthetic 4K Wallpaper.jpg"

[widget.audio-vis]
bands = 24
centered = false
color_1 = "primary"
color_2 = "tertiary"
mirrored = false
show_when_idle = true
type = "audio_visualizer"
width = 100

    [widget.audio-vis.actions]
    left = "panel-toggle control-center media"
    right = "media toggle"

[widget.battery]
display_mode = "graphic"
show_label = true
type = "battery"

[widget.clock]
format = "{:%H:%M}  {:%a %d %b}"
type = "clock"

[widget.network]
show_label = false
type = "network"

[widget.synthetic]
type = "kihu/synthetic-usage:usage"